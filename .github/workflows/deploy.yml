name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')
    runs-on: self-hosted
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Load server .env
        run: |
          set -euo pipefail
          ENV_FILE="${ACV2_ENV_FILE:-/home/admintechfarm/Access_Control_V2/.env}"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Missing $ENV_FILE — create once on the server (see docs/DEPLOY.md)."
            exit 1
          fi
          cp "$ENV_FILE" .env
          echo "Using env file: $ENV_FILE"

      - name: Deploy containers
        run: |
          chmod +x scripts/deploy-server.sh
          ./scripts/deploy-server.sh

      - name: Health check
        run: |
          set -euo pipefail
          API_PORT=8010
          if [ -f .env ]; then
            API_PORT="$(grep -E '^API_HOST_PORT=' .env | cut -d= -f2- | tr -d ' "\r' || true)"
            API_PORT="${API_PORT:-8010}"
          fi
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${API_PORT}/api/health" >/dev/null; then
              echo "API healthy on port ${API_PORT}"
              exit 0
            fi
            sleep 3
          done
          echo "::error::API health check failed on port ${API_PORT}"
          docker compose -f docker-compose.prod.yml logs --tail=80 api
          exit 1
